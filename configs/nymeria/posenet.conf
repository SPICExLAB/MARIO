# PoseNet (pose prior) training. Matches the run that produced
# experiments/posenet/best_model.ckpt: 50 Hz IMU, gravity removed, window 250 / stride 50,
# velocity Huber loss + L2 joint position / 6D joint rotation losses.
general:
{
   exp_dir: experiments
}

dataset: {
  include "../datasets/nymeria_pose_50hz.conf"
  collate: { type: motion }
}

train:
{
   network: codewithrot_pose_v4
   coordinate: body_coord
   use_raw_quat: False

   lr: 5e-4
   min_lr: 1e-6
   batch_size: 512
   max_epoches: 100
   patience: 10
   factor: 0.5
   weight_decay: 1e-4

   weight: 1e2
   cov_weight: 1e-4
   sparsity_weight: 0.0
   temporal_smooth_weight: 0.0
   position_weight: 0.0
   final_position_weight: 0.0
   joint_pos_weight: 5.0
   joint_rot_weight: 5.0

   propcov: True
   covaug: True
   loss: Huber_loss005
   save_freq: 5
   eval_freq: 1

   gradient_clip: 1.0
}
