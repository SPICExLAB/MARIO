general: 
{
   exp_dir: experiments/aria
}

dataset: {
  include "../datasets/aria_2imu.conf"
  collate: { type: motion }
}

train:
{
   coordinate: body_coord
   
   network: codewithrot_leftIMU
   use_raw_quat: False
   
   lr: 5e-4
   min_lr: 1e-6
   batch_size: 512
   max_epoches: 100
   patience: 10
   factor: 0.5
   weight_decay: 1e-4

   weight: 1e2
   cov_weight: 1e-4
   sparsity_weight: 0.0
   temporal_smooth_weight: 0.0
   position_weight: 0.0
   final_position_weight: 0.0
   joint_pos_weight: 0.0
   joint_rot_weight: 0.0

   propcov: True
   covaug: True
   loss: Huber_loss005
   save_freq: 5
   eval_freq: 1
   
#    # Gradient clipping for transformer stability
#    gradient_clip: 1.0
}