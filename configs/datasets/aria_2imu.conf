train:
{
    mode: train
    coordinate: body_coord
    rot_from_gyro: False  # Use SLAM rotation for model input during training
    load_left_imu: True  # Enable dual-IMU loading
    load_left_imu_cpf: True
    data_list:
    [
        {name: ariaCPF
        window_size: 1000
        step_size: 100
        data_root:  ${DATA_ROOT}/aria_processed_cpf_both/train
        data_drive: []
        },
    ]
    gravity: 9.81007
    remove_g: True

}

test:
{
    mode: test
    coordinate: body_coord
    rot_from_gyro: False  # Use gyro-integrated rotation for model input
    load_left_imu: True  # Enable dual-IMU loading
    load_left_imu_cpf: True
    rot_type: None
    data_list:
    [{
        name: ariaCPF
        window_size: 1000
        step_size: 100
        data_root: ${DATA_ROOT}/aria_processed_cpf_both/val
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: True

}

eval:
{
    mode: evaluate
    coordinate: body_coord
    rot_from_gyro: False  # Use gyro-integrated rotation for model input
    load_left_imu: True  # Enable dual-IMU loading
    load_left_imu_cpf: True
    rot_type: None
    data_list:
    [{
        name: ariaCPF
        window_size: 1000
        step_size: 100
        data_root: ${DATA_ROOT}/aria_processed_cpf_both/test
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: True

}

inference:
{
    mode: infevaluate
    coordinate: body_coord
    rot_from_gyro: True  # Use gyro-integrated rotation for model input
    load_left_imu: True  # Enable dual-IMU loading
    load_left_imu_cpf: True
    rot_type: None
    rot_path: PATH_TO_AIRIMU_NETOUTPUT
    data_list:
    [{
        name: ariaCPF
        window_size: 1000
        step_size: 100
        data_root: ${DATA_ROOT}/aria_processed_cpf_both/test
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: True

}
