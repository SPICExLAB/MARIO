train:
{
    mode: train
    coordinate: body_coord
    rot_from_gyro: False
    load_left_imu: True
    data_list:
    [
        {name: nymeria
        window_size: 1000
        step_size: 100
        data_root: ${DATA_ROOT}/processed_nymeria_2imu_both/train
        data_drive: []
        },
    ]
    gravity: 9.81007
    remove_g: True

}

