# Nymeria at 50 Hz with Xsens full-body pose. Used to train PoseNet (the pose prior).
# Produce with:
#   python preprocess_nymeria_body.py <nymeria_root>/train -o $DATA_ROOT/processed_data_body_Ty      --imu-hz 50 --pose-hz 50
#   python preprocess_nymeria_body.py <nymeria_root>/test  -o $DATA_ROOT/processed_data_test_body_Ty --imu-hz 50 --pose-hz 50
# Joint labels (SMPL joint positions + 6D rotations) are derived on the fly from
# the Xsens pose using the SMPL body model (see core/paths.py for its location).

train:
{
    mode: train
    coordinate: body_coord
    use_body: True
    load_baro: False
    load_mag: False
    load_left_imu: False
    load_left_imu_cpf: False
    resample_hz: 50
    data_list:
    [
        {name: nymeria
        window_size: 250
        step_size: 50
        data_root: ${DATA_ROOT}/processed_data_body_Ty
        data_drive: []
        },
    ]
    gravity: 9.81007
    remove_g: True
}

test:
{
    mode: test
    coordinate: body_coord
    use_body: True
    load_baro: False
    load_mag: False
    load_left_imu: False
    load_left_imu_cpf: False
    resample_hz: 50
    rot_type: None
    data_list:
    [{
        name: nymeria
        window_size: 250
        step_size: 50
        data_root: ${DATA_ROOT}/processed_data_test_body_Ty
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: True
}

eval:
{
    mode: evaluate
    coordinate: body_coord
    use_body: True
    load_baro: False
    load_mag: False
    load_left_imu: False
    load_left_imu_cpf: False
    resample_hz: 50
    rot_type: None
    data_list:
    [{
        name: nymeria
        window_size: 250
        step_size: 50
        data_root: ${DATA_ROOT}/processed_data_test_body_Ty
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: True
}

inference:
{
    mode: infevaluate
    coordinate: body_coord
    use_body: True
    load_baro: False
    load_mag: False
    load_left_imu: False
    load_left_imu_cpf: False
    resample_hz: 50
    rot_type: None
    rot_path: PATH_TO_AIRIMU_NETOUTPUT
    data_list:
    [{
        name: nymeria
        window_size: 250
        step_size: 50
        data_root: ${DATA_ROOT}/processed_data_test_body_Ty
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: True
}
