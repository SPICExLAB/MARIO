inference:
{
    mode: infevaluate
    coordinate: body_coord
    rot_from_gyro: True  # Use gyro-integrated rotation for model input
    load_left_imu: True  # Enable dual-IMU loading
    load_left_imu_cpf: True
    rot_type: None
    rot_path: PATH_TO_AIRIMU_NETOUTPUT
    data_list:
    [{
        name: ariaCPF
        window_size: 1000
        step_size: 100
        data_root: ${DATA_ROOT}/aria_processed_cpf_both/all
        data_drive: []
    }]
    gravity: 9.81007
    remove_g: True

}
